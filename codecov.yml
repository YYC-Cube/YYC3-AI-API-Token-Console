comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        # 基线锁定 39% (vitest.config.ts thresholds 同源), 防退化; 爬坡至 80% 见 CICD.md
        target: 38%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

ignore:
  - "deploy/**"
  - "scripts/**"
  - "docs/**"
  - "public/**"
  - "src/app/ci/**"
  - "src/imports/**"
