# ============================================================================
#  YYC³ GitHub Pages 自动部署 — YYC3-AI-API-Token-Console
#  生产的门禁全绿后 → vite build (VITE_BASE=/) → 部署 Pages
#  自定义域名: token.yyc3.vip (CNAME 文件自动随 dist 发布)
#
#  前置要求 (一次性, 仓库 Settings → Pages):
#    Source: GitHub Actions
#    Custom domain: token.yyc3.vip  (或由本工作流 CNAME 文件自动绑定)
#
#  2026-10-05 判例: node24 对齐 (configure-pages v6 / upload-pages-artifact
#  v4 / deploy-pages v5) + runner 钉 ubuntu-24.04 — 详见 ci.yml 头注
# ============================================================================
name: YYC³ Pages Deploy

on:
  # main 分支 CI 全绿后自动部署
  workflow_run:
    workflows: ["YYC³ CI"]
    types: [completed]
    branches: [main]
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 单实例部署：新部署排队，不取消进行中的部署（避免 Pages 状态不一致）
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  build:
    name: "📦 Build for Pages"
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CNAME 已入库 (public/CNAME → token.yyc3.vip)，随 public/ 自动拷贝至 dist/
      # 防御性兜底：文件意外缺失时重建，保证自定义域名绑定不中断
      - name: Ensure CNAME exists
        run: '[ -f public/CNAME ] || echo "token.yyc3.vip" > public/CNAME'

      # 根路径部署：token.yyc3.vip 托管于域名根，base=/ 与 vite.config.ts 默认值一致
      # 2026-09-29 批12 OBS-5: 走 pnpm build 完整链 (vite build + inject-precache
      # 产物清单注入) — 裸 vite build 会绕过注入, 线上 SW 预缓存退化为空清单
      - name: Build (base=/)
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: "🚀 Deploy to Pages (token.yyc3.vip)"
    environment:
      name: github-pages
      url: https://token.yyc3.vip
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
