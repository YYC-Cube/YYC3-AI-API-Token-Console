# ============================================================================
#  YYC³ CI Pipeline — YYC3-AI-API-Token-Console
#  对标团队规范《模版闭环》.github/workflows/ci.yml + 项目 Vite 工具链适配
#
#  触发: push 到 main/develop · 所有 PR
#  阶段: 🔍 Typecheck → 🧹 Lint(含分层边界) → 🧪 Test(unit 分级+基线) → 🛡️ Security Scan
#        → 📦 Build(+工程纪律: ast-grep/体量/knip + 产物零密钥)
#  下游: pages.yml (CI 全绿后自动部署 GitHub Pages → token.yyc3.vip)
# ============================================================================

name: YYC³ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  # ============================================================
  # 1. 类型检查 (TypeScript strict)
  # ============================================================
  typecheck:
    name: "🔍 Typecheck · tsc --noEmit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: pnpm typecheck

  # ============================================================
  # 1b. ESLint 静态检查 (0 errors 门槛)
  # ============================================================
  lint:
    name: "🧹 Lint · eslint 0-errors"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "ESLint (gate: 0 errors)"
        run: pnpm lint

  # ============================================================
  # 2. 单元测试 + 覆盖率 (80% 门槛)
  # ============================================================
  unit-test:
    name: "🧪 Unit Test · vitest + coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (JUnit output)
        # Task 2.3 (Phase 2) — 测试分级门禁: CI 默认只跑 unit 档 (零外部依赖)
        # integration 档需 YYC3_TEST_INTEGRATION=1 显式开启, e2e 未接入
        run: pnpm test:ci

      - name: Run coverage check (gate ≥ 80%)
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: PR coverage summary
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  # ============================================================
  # 3. 安全扫描 (gitleaks 密钥泄露检测)
  # ============================================================
  security-scan:
    name: "🛡️ Security Scan · gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mermaid fence check (docs quality gate)
        run: python3 scripts/check_mermaid.py

  # ============================================================
  # 4. 生产构建验证
  # ============================================================
  build:
    name: "📦 Build · vite production"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ── 工程纪律守护 (Phase 2/3) — 全部绿色后置, 与五阶段门禁协同 ──
      # import 边界 (Task 3.1) 已并入 Lint 阶段 eslint boundaries 规则, 此处不重复
      - name: "Discipline: ast-grep structural rules"
        # Task 3.7 — 6 条反模式规则 (裸 WebSocket/document.write/innerHTML/隐式 eval/process.env/硬编码密钥)
        run: pnpm astgrep

      - name: "Discipline: file size baseline (Facade+Siblings §6.6)"
        # Task 2.2 — 超阈值告警 + 基线文件只减不增 (增长即失败)
        run: pnpm size:check

      - name: "Discipline: knip dead-code baseline"
        # Task 2.4 — 基线比对门禁: 新死代码禁止引入, 存量收敛后季度下调
        run: node scripts/knip-check.mjs

      - name: "Assert: build artifacts contain no secrets"
        # Task 1.5 (Phase 1) — 构建产物零密钥断言, 命中即失败 (协同开发文档 §6.5)
        # 占位符豁免: sk-xxxx…(x 连续) 为源码文档示例, 非真实密钥
        run: |
          echo "Scanning dist/ for secret patterns..."
          PATTERNS='BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk-[A-Za-z0-9-]{39,}|sk-ant-[A-Za-z0-9-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          MATCHES=$(grep -rInE "$PATTERNS" dist/ 2>/dev/null | grep -vE "sk-x{10,}" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Secret pattern detected in build artifacts!"
            echo "$MATCHES"
            exit 1
          fi
          echo "✓ Build artifacts clean (no secret patterns in dist/)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
