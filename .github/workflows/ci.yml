# ============================================================================
#  YYC³ CI Pipeline — YYC3-AI-API-Token-Console
#  对标团队规范《模版闭环》.github/workflows/ci.yml + 项目 Vite 工具链适配
#
#  触发: push 到 main/develop · 所有 PR
#  阶段: 🔍 Typecheck → 🧹 Lint → 🧪 Test(80% 门槛+Codecov) → 🛡️ Security Scan → 📦 Build
#  下游: pages.yml (CI 全绿后自动部署 GitHub Pages → token.yyc3.vip)
# ============================================================================

name: YYC³ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  # ============================================================
  # 1. 类型检查 (TypeScript strict)
  # ============================================================
  typecheck:
    name: "🔍 Typecheck · tsc --noEmit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: pnpm typecheck

  # ============================================================
  # 1b. ESLint 静态检查 (0 errors 门槛)
  # ============================================================
  lint:
    name: "🧹 Lint · eslint 0-errors"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (gate: 0 errors)
        run: pnpm lint

  # ============================================================
  # 2. 单元测试 + 覆盖率 (80% 门槛)
  # ============================================================
  unit-test:
    name: "🧪 Unit Test · vitest + coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (JUnit output)
        run: pnpm test:ci

      - name: Run coverage check (gate ≥ 80%)
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: PR coverage summary
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  # ============================================================
  # 3. 安全扫描 (gitleaks 密钥泄露检测)
  # ============================================================
  security-scan:
    name: "🛡️ Security Scan · gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mermaid fence check (docs quality gate)
        run: python3 scripts/check_mermaid.py

  # ============================================================
  # 4. 生产构建验证
  # ============================================================
  build:
    name: "📦 Build · vite production"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
