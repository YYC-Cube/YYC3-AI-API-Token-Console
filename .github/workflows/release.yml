# ============================================================================
#  YYC³ Release Pipeline — YYC3-AI-API-Token-Console
#  tag v*.*.* 触发 → Final Gates → vite build → GitHub Release + 制品归档
# ============================================================================

name: YYC³ Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  release-build:
    name: "📦 Release Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Final gates（与 ci.yml 同款，双保险）──────────────
      - name: Final gates · typecheck
        run: pnpm typecheck

      - name: Final gates · test + coverage (≥80%)
        run: pnpm test:coverage

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 生产构建 ──────────────────────────────────────────
      - name: Build
        run: pnpm build

      - name: Package dist for release
        run: cd dist && zip -r ../yyc3-ai-api-token-console-${{ github.ref_name }}.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            yyc3-ai-api-token-console-*.zip
          retention-days: 30

  release-publish:
    name: "🚀 GitHub Release"
    runs-on: ubuntu-latest
    needs: release-build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist-release/

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: dist-release/*
          generate_release_notes: true

  release-notify:
    name: "📣 Notify"
    runs-on: ubuntu-latest
    needs: [release-build, release-publish]
    if: always()
    steps:
      - name: On failure → admin@
        if: failure()
        run: echo "Release FAILED for ${{ github.ref_name }} — notify admin@yanyucloud.com"
      - name: On success → broadcast
        if: success()
        run: echo "Release ${{ github.ref_name }} published ✅ — announce via dev@yanyucloud.com"
