id: no-hardcoded-secret-literal-tsx
language: tsx
severity: error
message: >
  疑似硬编码密钥字面量 — API Key/Token 必须经环境变量或用户输入注入, 禁止进源码。
  若为占位符/示例, 请改为 sk-xxxx… 形式并在行内注释说明。
note: YYC³ 结构化守护规则库 #6 (tsx) — 协同开发文档 §6.8 (与 CI 产物断言/gitleaks 三层纵深)
files:
  - "src/**"
ignores:
  - "src/app/__tests__/**"
rule:
  kind: string_fragment
  regex: "(sk|pk)_(live|test)_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}"
